name: Build Widevine Release

"on":
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get current Chrome stable version
        id: chrome
        shell: powershell
        run: |
          $r = Invoke-RestMethod "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Windows&num=1"
          $v = $r[0].version
          Write-Host "Chrome stable: $v"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "CHROME_VERSION=$v"

      - name: Fetch Widevine package from Google component updater
        id: widevine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $tmp = Join-Path $env:TEMP 'widevine-crx'
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          $chromeVer = "${{ steps.chrome.outputs.CHROME_VERSION }}"

          # Omaha protocol v3.1 (the same mechanism Chrome/Edge use to update Widevine)
          $body = @{
            request = @{
              '@os' = 'win'; '@updater' = 'chrome'; 'acceptformat' = 'crx2,crx3'
              app = @(@{ appid = 'oimompecagnajdejgnnjijobebaeigek'; enabled = $true; ping = @{ r = -2 }; updatecheck = @{}; version = '0.0.0.0' })
              arch = 'x64'; dedup = 'cr'; domainjoined = $false
              hw = @{ avx = 1; physmemory = 16; sse = 1; sse2 = 1; sse3 = 1; sse41 = 1; sse42 = 1; ssse3 = 1 }
              lang = 'en-US'; nacl_arch = 'x86-64'
              os = @{ arch = 'x86_64'; platform = 'Windows'; version = '10.0.26100.0' }
              prod = 'Chrome'; prodchannel = 'stable'; prodversion = $chromeVer; protocol = '3.1'
              requestid = '{7cf0f01e-3f0f-4f10-9b28-8ddddddd0001}'; sessionid = '{7cf0f01e-3f0f-4f10-9b28-8ddddddd0002}'
              updaterchannel = 'stable'; updaterversion = $chromeVer
            }
          } | ConvertTo-Json -Depth 6

          $resp = Invoke-RestMethod -Method Post -Uri "https://update.googleapis.com/service/update2/json" -ContentType 'application/json' -Body $body
          $uc = $resp.response.app[0].updatecheck
          if ($uc.status -ne 'ok') { throw "Update check failed: $($uc.status)" }

          $ver = $uc.manifest.version
          $codebase = $uc.urls.url | Where-Object { $_.codebase -like 'https://*' } | Select-Object -First 1 -ExpandProperty codebase
          $pkg = $uc.manifest.packages.package[0]
          $pkgUrl = $codebase + $pkg.name

          Write-Host "Widevine version: $ver"
          Write-Host "Package: $($pkg.name) ($([math]::Round($pkg.size / 1MB, 1)) MB)"

          Invoke-WebRequest -Uri $pkgUrl -OutFile "$tmp\widevine.crx3"

          $hash = (Get-FileHash "$tmp\widevine.crx3" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $pkg.hash_sha256.ToLower()) { throw "SHA256 mismatch: got $hash" }
          Write-Host "SHA256 verified"

          # Strip CRX3 header: locate the ZIP signature (PK\x03\x04) and cut everything before it
          $bytes = [System.IO.File]::ReadAllBytes("$tmp\widevine.crx3")
          $idx = -1
          for ($i = 0; $i -lt $bytes.Length - 4; $i++) {
            if ($bytes[$i] -eq 0x50 -and $bytes[$i+1] -eq 0x4B -and $bytes[$i+2] -eq 0x03 -and $bytes[$i+3] -eq 0x04) { $idx = $i; break }
          }
          if ($idx -lt 0) { throw 'ZIP signature not found in CRX' }
          [System.IO.File]::WriteAllBytes("$tmp\widevine.zip", [byte[]]$bytes[$idx..($bytes.Length - 1)])

          Expand-Archive -Path "$tmp\widevine.zip" -DestinationPath "$tmp\extracted" -Force

          $manifestPath = "$tmp\extracted\manifest.json"
          if (-not (Test-Path $manifestPath)) { throw 'manifest.json not found' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.name -notlike '*Widevine*') { throw "Not a Widevine package: $($manifest.name)" }
          if (-not (Test-Path "$tmp\extracted\_platform_specific\win_x64\widevinecdm.dll")) { throw 'widevinecdm.dll not found' }

          # Target layout: WidevineCdm\<version>\manifest.json + _platform_specific\...
          $stage = "$tmp\stage"
          New-Item -ItemType Directory -Path "$stage\WidevineCdm\$ver" -Force | Out-Null
          Copy-Item -Path "$tmp\extracted\*" -Destination "$stage\WidevineCdm\$ver" -Recurse -Force
          Compress-Archive -Path "$stage\WidevineCdm" -DestinationPath "$env:GITHUB_WORKSPACE\widevine-win-x64-$ver.zip" -CompressionLevel Optimal

          Add-Content -Path $env:GITHUB_OUTPUT -Value "WIDEVINE_VERSION=$ver"

      - name: Create release (skip if version already released)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.widevine.outputs.WIDEVINE_VERSION }}"
          gh release view "widevine-$ver" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "SKIP: widevine-$ver already exists"
            exit 0
          }
          gh release create "widevine-$ver" "widevine-win-x64-$ver.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Widevine CDM $ver (win-x64)" `
            --notes "Widevine Content Decryption Module $ver (Windows x64) downloaded from Google's component updater (Chrome distribution channel).

Extract the zip into your browser's User Data folder (the WidevineCdm\<version>\ layout is included) and restart the browser."
